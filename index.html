<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#faf4ee">
  <title>波翠（なみ）</title>
  <link rel="icon" href="./assets/wave.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script src="./motion.js" defer></script>
</head>
<body>
  <main id="top">
    <section class="cover" aria-labelledby="name">
      <div class="paper">
        <svg class="tide" aria-hidden="true" viewBox="0 0 840 740" preserveAspectRatio="xMidYMid slice">
          <defs>
            <linearGradient id="tide-wash" x1="0" x2="1" y1="0" y2="1">
              <stop stop-color="#eeb5a8" stop-opacity=".54"/>
              <stop offset=".64" stop-color="#e6bdca" stop-opacity=".34"/>
              <stop offset="1" stop-color="#b4a2c6" stop-opacity=".44"/>
            </linearGradient>
            <linearGradient id="tide-ink" x1="0" x2="1" y1="1" y2="0">
              <stop stop-color="#b27b88" stop-opacity=".2"/>
              <stop offset=".56" stop-color="#a77689" stop-opacity=".7"/>
              <stop offset="1" stop-color="#9b88b1" stop-opacity=".22"/>
            </linearGradient>
            <path id="tide-line" pathLength="1" d="M-78 535C112 606 158 469 331 484S597 639 761 468 860 247 953 201"/>
          </defs>
          <path class="tide-wash" fill="url(#tide-wash)" d="M-99 539C110 601 149 449 335 471s250 145 410-13 112-217 225-264v601H-99Z"/>
          <g class="tide-lines" fill="none" stroke="url(#tide-ink)" stroke-width=".85">
            <use href="#tide-line"/>
            <use href="#tide-line" transform="translate(0 12)"/>
            <use href="#tide-line" transform="translate(0 24)"/>
            <use href="#tide-line" transform="translate(0 36)"/>
            <use href="#tide-line" transform="translate(0 48)"/>
            <use href="#tide-line" transform="translate(0 60)"/>
          </g>
        </svg>
        <div class="paper-keyline" aria-hidden="true"></div>

        <p class="welcome" lang="en">
          <span>Welcome to the</span>
          <span>Matsubara Family</span>
        </p>

        <div class="composition">
          <div class="name-block">
            <h1 id="name" aria-label="波翠（なみ）">
              <span class="glyph"><span>波</span></span>
              <span class="glyph"><span>翠</span></span>
              <span class="kana" aria-hidden="true">なみ</span>
            </h1>
          </div>

          <figure class="portrait">
            <div class="portrait-arch">
              <img src="./assets/sleeping.webp" width="922" height="1044" alt="青い服を着てすやすや眠る波翠ちゃん" fetchpriority="high">
            </div>
          </figure>

          <svg class="fish" aria-hidden="true" viewBox="0 0 170 98">
            <defs>
              <g id="fish">
                <path d="M0 0C6-6 16-6 23 0 16 6 6 6 0 0ZM1 0l-6-4v8Z"/>
                <path class="fish-mark" d="M8-3q4 3 0 6m4-7q4 4 0 8m4-7q3 3 0 6"/>
              </g>
            </defs>
            <use href="#fish" transform="translate(25 73) rotate(-21) scale(.83)"/>
            <use href="#fish" transform="translate(50 50) rotate(-24) scale(.69)"/>
            <use href="#fish" transform="translate(63 71) rotate(-19) scale(1.04)"/>
            <use href="#fish" transform="translate(95 46) rotate(-20) scale(.83)"/>
            <use href="#fish" transform="translate(111 64) rotate(-18) scale(.57)"/>
            <use href="#fish" transform="translate(132 33) rotate(-16) scale(.72)"/>
            <path class="fish-spark" d="M74 26v10m-5-5h10m69 21v8m-4-4h8"/>
          </svg>
        </div>

        <div class="birth-details">
          <p class="date">
            <time datetime="2026-10-23" aria-label="2026年10月23日">2026<span>.</span>10<span>.</span>23</time>
            <span class="weekday" lang="en" aria-label="金曜日">FRI</span>
          </p>
          <ul class="numbers" aria-label="出生時の記録">
            <li><time datetime="2026-10-23T04:55:00+09:00">4:55 <span lang="en">AM</span></time></li>
            <li>3,090 <span>g</span></li>
            <li>50.5 <span>cm</span></li>
          </ul>
        </div>

        <a class="down" href="#album" aria-label="写真を見る">
          <svg aria-hidden="true" viewBox="0 0 22 28"><path d="M11 3v20m-5-5 5 5 5-5"/></svg>
        </a>
      </div>
    </section>

    <section class="album" id="album" aria-label="波翠ちゃんの写真">
      <svg class="album-tide" aria-hidden="true" viewBox="0 0 720 1360" preserveAspectRatio="none">
        <path d="M-95 119C201 270 565 24 737 203S394 555 159 578-63 795 238 883s429 100 507 359"/>
        <path d="M-95 139C201 290 565 44 737 223S394 575 159 598-63 815 238 903s429 100 507 359"/>
        <path d="M-95 159C201 310 565 64 737 243S394 595 159 618-63 835 238 923s429 100 507 359"/>
        <path d="M-95 179C201 330 565 84 737 263S394 615 159 638-63 855 238 943s429 100 507 359"/>
      </svg>
      <div class="album-grid">
        <figure class="memory first" data-reveal>
          <div class="memory-border">
            <div class="memory-window">
              <img src="./assets/first-moment.webp" width="643" height="610" alt="黄色い帽子をかぶり、白いタオルにくるまれた波翠ちゃん" loading="lazy" decoding="async">
            </div>
          </div>
        </figure>
        <figure class="memory together" data-reveal>
          <div class="memory-border">
            <div class="memory-window">
              <img src="./assets/together.webp" width="1100" height="924" alt="笑顔で波翠ちゃんをのぞき込む家族" loading="lazy" decoding="async">
            </div>
          </div>
        </figure>
        <figure class="memory weight" data-reveal>
          <div class="memory-border">
            <div class="memory-window">
              <img src="./assets/first-weight.webp" width="532" height="384" alt="3.090キログラムと表示された体重計" loading="lazy" decoding="async">
            </div>
          </div>
        </figure>
        <figure class="memory hands" data-reveal>
          <div class="memory-border">
            <div class="memory-window">
              <img src="./assets/little-hands.webp" width="949" height="1150" alt="小さな手を顔のそばに上げ、大きく口を開ける波翠ちゃん" loading="lazy" decoding="async">
            </div>
          </div>
        </figure>
        <figure class="memory family" data-reveal>
          <div class="memory-border">
            <div class="memory-window">
              <img src="./assets/with-family.webp" width="1030" height="772" alt="並んで横になり、眠る波翠ちゃんを見つめるお母さん" loading="lazy" decoding="async">
            </div>
          </div>
        </figure>
      </div>
    </section>

    <footer class="closing">
      <a href="#top" aria-label="ページのはじめへ戻る">
        <svg aria-hidden="true" viewBox="0 0 46 46">
          <circle cx="23" cy="23" r="21"/>
          <path d="M10 24c5 0 6-5 11-5s6 5 11 5c2 0 3-.5 4-1.4M10 29c5 0 6-5 11-5s6 5 11 5c2 0 3-.5 4-1.4"/>
        </svg>
      </a>
    </footer>
  </main>
</body>
</html>
